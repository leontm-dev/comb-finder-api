services:
  comp-finder-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comp_finder_api
    restart: always
    ports:
      - '3030:3030'
    environment:
      - NODE_ENV=production
      - PORT=3030
      # Hier kannst du weitere Umgebungsvariablen wie z.B. DATABASE_URL ergänzen
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
